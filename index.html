<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=0.35, user-scalable=yes">
  <title>মানপত্ৰ - বামুনীগাঁও কেম্প সাৰ্ব্বজনীন দুৰ্গা পূজা সমিতি</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Print & PDF Export Rules */
    @page {
      size: A4 landscape;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Screen Control UI */
    @media screen {
      body {
        background-color: #1a1a1e;
        font-family: sans-serif;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .control-panel {
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        max-width: 1123px;
        width: 100%;
        margin-bottom: 40px;
      }

      .control-panel h2 {
        color: #7a0b12;
        margin-bottom: 8px;
        font-family: 'Noto Serif Bengali', serif;
      }

      textarea {
        width: 100%;
        height: 120px;
        padding: 12px;
        border: 1.5px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        font-family: 'Noto Serif Bengali', serif;
        box-sizing: border-box;
      }

      .btn-bar {
        margin-top: 15px;
        display: flex;
        gap: 12px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-family: 'Noto Serif Bengali', sans-serif;
      }

      .btn-generate {
        background-color: #7a0b12;
        color: #fff;
      }

      .btn-generate:hover {
        background-color: #9c0e17;
      }

      .btn-print {
        background-color: #c8963e;
        color: #1a1a1a;
      }

      .btn-print:hover {
        background-color: #dfa849;
      }

      #certificates-wrapper {
        display: flex;
        flex-direction: column;
        gap: 35px;
      }
    }

    @media print {
      body {
        background: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .control-panel {
        display: none !important;
      }

      #certificates-wrapper {
        display: block !important;
      }

      .certificate-sheet {
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }

    /* Fixed A4 Landscape Canvas */
    .certificate-sheet {
      width: 1123px;
      height: 794px;
      min-width: 1123px;
      min-height: 794px;
      position: relative;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 16px;
      padding: 58px 90px 40px 90px;
      overflow: hidden;
      font-family: 'Noto Serif Bengali', serif;
      box-sizing: border-box;
      background-color: #fffdf8;
    }

    /* Dedicated Background Layer */
    .dedicated-bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 0;
    }

    /* Header Section */
    .header-section {
      text-align: center;
      position: relative;
      z-index: 3;
      width: 100%;
    }

    .shloka {
      font-size: 15px;
      font-weight: 700;
      color: #800A12 !important;
      letter-spacing: 1.5px;
      margin-top: 102px;
      margin-bottom: 2px;
    }

    .celebration-badge {
      display: inline-block;
      color: #7a0b12 !important;
      font-size: 13.5px;
      font-weight: 800;
      background-color: #fcf6e8 !important;
      border: 1.5px solid #b8860b !important;
      padding: 2px 22px;
      border-radius: 15px;
      margin-bottom: 2px;
    }

    .committee-title {
      font-size: 31px;
      font-weight: 900;
      color: #120a06 !important;
      margin-top: 2px;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .committee-address {
      font-size: 14px;
      color: #3b2214 !important;
      font-weight: 700;
      margin-top: 2px;
      line-height: 1.4;
    }

    .estd-year {
      font-size: 13.5px;
      color: #7a0b12 !important;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .title-ribbon {
      background-color: #7a0b12 !important;
      color: #ffffff !important;
      display: inline-block;
      padding: 4px 45px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-top: 8px;
      border-radius: 4px;
      border: 1.5px solid #c8963e !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Body Section */
    .body-section {
      text-align: center;
      padding: 0 26px;
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .poetic-quote {
      font-style: italic;
      font-size: 14px;
      color: #6e0d14 !important;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .recipient-block {
      margin: 2px 0 10px;
    }

    .recipient-name {
      font-size: 28px;
      font-weight: 900;
      color: #7a0b12 !important;
      display: inline-block;
      border-bottom: 2.5px solid #c8963e !important;
      padding: 0 18px 4px;
      letter-spacing: 0.5px;
    }

    .main-citation {
      font-size: 16px;
      line-height: 1.85;
      color: #1a0f09 !important;
      font-weight: 600;
      text-align: justify;
      text-align-last: center;
    }

    .blessing-text {
      font-size: 14.5px;
      font-weight: 800;
      color: #5a0a10 !important;
      margin-top: 8px;
    }

    /* Vector Signature Overlay Block */
    .signatures-overlay {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      height: 72px;
      z-index: 5;
      pointer-events: none;
      font-family: 'Noto Serif Bengali', serif;
    }

    /* Baseline-locked box for digital sign graphics */
    .sig-box {
      height: 44px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 6px;
    }

    /* Single Officers: President & VP */
    .sig-president {
      position: absolute;
      left: 20%;
      width: 15%;
      text-align: center;
    }

    .sig-vp {
      position: absolute;
      left: 38%;
      width: 13%;
      text-align: center;
    }

    .sig-president .sig-img,
    .sig-vp .sig-img {
      height: 30px;
      max-width: 115px;
      object-fit: contain;
      filter: contrast(125%);
    }

    /* Secretarial Panel (3 Signatories Side-by-Side) */
    .sig-secretariat {
      position: absolute;
      left: 54%;
      width: 27%;
      text-align: center;
      transform: translateY(4px);
    }

    .secretaries-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .secretaries-row .sec-unit {
      flex: 1;
      text-align: center;
    }

    .secretaries-row .sig-box {
      height: 40px;
    }

    .secretaries-row .sig-img {
      height: 32px;
      max-width: 86px;
      object-fit: contain;
      filter: contrast(125%);
    }

    /* Typography for Signers */
    .sig-name {
      font-size: 15px;
      font-weight: 800;
      color: #120a06 !important;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .sig-role {
      font-size: 12.5px;
      font-weight: 600;
      color: #422619 !important;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="control-panel">
    <h2>বাল্ক মানপত্ৰ জেনেৰেটৰ (Bulk Certificate Generator)</h2>
    <p style="color: #555; margin-bottom: 8px; font-size: 14px;">
      Honoree names list (one name per line):
    </p>
    <textarea id="namesInput">
ৰমেশ শৰ্মা
অনিল বৰ্মন
দীপক কলিতা
বিবেকানন্দ ঘোষ
প্ৰণৱ কুমাৰ দাস</textarea>
    
    <div class="btn-bar">
      <button class="btn-generate" onclick="generateAll()">১. Generate All Certificates</button>
      <button class="btn-print" onclick="window.print()">২. Print / Save as PDF</button>
    </div>
  </div>

  <!-- Render Container -->
  <div id="certificates-wrapper"></div>

  <script>
    function tryNextBackground(img) {
      const paths = [
        'background.png',
        'background.jpg',
        'background.jpeg',
        '../background.png',
        '../background.jpg'
      ];
      let step = parseInt(img.getAttribute('data-step') || '0', 10);
      if (step < paths.length) {
        img.setAttribute('data-step', step + 1);
        img.src = paths[step];
      }
    }

    function generateAll() {
      const input = document.getElementById("namesInput").value.trim();
      const names = input.split("\n").map(n => n.trim()).filter(n => n.length > 0);
      const wrapper = document.getElementById("certificates-wrapper");
      
      wrapper.innerHTML = "";

      names.forEach(name => {
        const certHTML = `
          <div class="certificate-sheet">
            <!-- Dedicated Full Background -->
            <img src="background.svg" class="dedicated-bg-layer" alt="Background">

            <!-- Header Section -->
            <div class="header-section">
              <div class="shloka">॥ শ্ৰী শ্ৰী দুৰ্গাদেৱ্যৈ নমঃ ॥</div>
              <div><span class="celebration-badge">৬৩ তম বাৰ্ষিক শাৰদীয় দুৰ্গোৎসৱ</span></div>
              <h1 class="committee-title">বামুনীগাঁও কেম্প সাৰ্ব্বজনীন দুৰ্গা পূজা সমিতি</h1>
              <p class="committee-address">পুৰাণ বজাৰ, বামুনীগাঁও কেম্প, কামৰূপ, অসম</p>
              <p class="estd-year">স্থাপিত : ১৯৬৪ ইং</p>

              <div class="title-ribbon">কৃতজ্ঞতা আৰু প্ৰশংসা মানপত্ৰ</div>
            </div>

            <!-- Body Section -->
            <div class="body-section">
              <div class="poetic-quote">
                “শাৰদীয় শেৱালিৰ সুবাসে আনে দেৱী বন্দনাৰ সুৰ, আপোনাৰ সেৱাই কৰে পূজাক সাফল্যমণ্ডিত...”
              </div>

              <div class="recipient-block">
                <div class="recipient-name">শ্ৰী/শ্ৰীমতী ${name}</div>
              </div>

              <p class="main-citation">
                ১৯৬৪ চনৰ পৰা প্ৰবাহিত আমাৰ ঐতিহ্যমণ্ডিত <b>বামুনীগাঁও কেম্প সাৰ্ব্বজনীন দুৰ্গা পূজাখনিৰ</b> গৌৰৱোজ্জ্বল যাত্ৰাত আপোনাৰ নিৰলস কৰ্মনিষ্ঠা, নিস্বাৰ্থ সেৱা আৰু বছৰ বছৰ ধৰি আগবঢ়োৱা অনবদ্য অৱদানক গভীৰ কৃতজ্ঞতাৰে স্বীকাৰ কৰি সমিতিয়ে এই <b>প্ৰশংসা পত্ৰ</b> সাদৰে অৰ্পণ কৰিলে।
              </p>

              <p class="blessing-text">
                “জগজ্জননী মা দুৰ্গাৰ কৃপাত আপোনাৰ আৰু আপোনাৰ পৰিয়ালৰ জীৱন সদায় সুখ, শান্তি, সুস্বাস্থ্য আৰু অপাৰ সমৃদ্ধিৰে ভৰি পৰক।”
              </p>
            </div>

            <!-- High-DPI Vector Signature Overlay -->
            <div class="signatures-overlay">
              <!-- Column 1: সভাপতি -->
              <div class="sig-president">
                <div class="sig-box">
                  <img src="sig-president.png" alt="" class="sig-img" onerror="this.style.display='none'">
                </div>
                <div class="sig-name">সমৰ কুমাৰ ঘোষ</div>
                <div class="sig-role">সভাপতি</div>
              </div>

              <!-- Column 2: উপ-সভাপতি -->
              <div class="sig-vp">
                <div class="sig-box">
                  <img src="sig-vp.png" alt="" class="sig-img" onerror="this.style.display='none'">
                </div>
                <div class="sig-name">স্বৰ্ণ দাস</div>
                <div class="sig-role">উপ-সভাপতি</div>
              </div>

              <!-- Column 3: সম্পাদক মণ্ডলী -->
              <div class="sig-secretariat">
                <div class="secretaries-row">
                  <div class="sec-unit">
                    <div class="sig-box">
                      <img src="sig-sec1.png" alt="" class="sig-img" onerror="this.style.display='none'">
                    </div>
                    <div class="sig-name">পংকজ দাস</div>
                  </div>
                  <div class="sec-unit">
                    <div class="sig-box">
                      <img src="sig-sec2.png" alt="" class="sig-img" onerror="this.style.display='none'">
                    </div>
                    <div class="sig-name">সুকুমাৰ দেৱনাথ</div>
                  </div>
                  <div class="sec-unit">
                    <div class="sig-box">
                      <img src="sig-sec3.png" alt="" class="sig-img" onerror="this.style.display='none'">
                    </div>
                    <div class="sig-name">বিকাশ ৰয়</div>
                  </div>
                </div>
                <div class="sig-role">সম্পাদক মণ্ডলী</div>
              </div>
            </div>
          </div>
        `;
        wrapper.insertAdjacentHTML('beforeend', certHTML);
      });
    }

    window.onload = generateAll;
  </script>
</body>
</html>
