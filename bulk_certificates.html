<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=0.35, user-scalable=yes">
  <title>Bulk Certificate Generator - বামুনগাঁও কেম্প দুৰ্গাপূজা সমিতি</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+Bengali:ital,wght@0,400;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">

  <style>
    /* Screen Control UI */
    @media screen {
      body {
        background-color: #1a1a1e;
        font-family: sans-serif;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .control-panel {
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        max-width: 820px;
        width: 100%;
        margin-bottom: 40px;
      }

      .control-panel h2 {
        color: #6b0c11;
        margin-bottom: 8px;
        font-family: 'Noto Serif Bengali', serif;
      }

      textarea {
        width: 100%;
        height: 120px;
        padding: 12px;
        border: 1.5px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        font-family: 'Noto Serif Bengali', serif;
        box-sizing: border-box;
      }

      .btn-bar {
        margin-top: 15px;
        display: flex;
        gap: 12px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-family: 'Noto Serif Bengali', sans-serif;
      }

      .btn-generate {
        background-color: #6b0c11;
        color: #fff;
      }

      .btn-generate:hover {
        background-color: #8c1017;
      }

      .btn-print {
        background-color: #d4af37;
        color: #1a1a1a;
      }

      .btn-print:hover {
        background-color: #e5be42;
      }

      #certificates-wrapper {
        display: flex;
        flex-direction: column;
        gap: 35px;
      }
    }

    /* Print & PDF Export Settings */
    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {
      body {
        background: none;
        padding: 0;
        margin: 0;
      }

      .control-panel {
        display: none !important;
      }

      #certificates-wrapper {
        display: block !important;
      }

      .certificate-sheet {
        page-break-after: always;
        break-after: page;
        box-shadow: none !important;
        margin: 0;
        width: 100vw !important;
        height: 100vh !important;
      }
    }

    /* A4 Landscape Canvas */
    .certificate-sheet {
      width: 1123px;
      height: 794px;
      min-width: 1123px;
      min-height: 794px;
      position: relative;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      /* Generous padding so text never overlaps your background borders/motifs */
      padding: 60px 100px 50px 100px;
      overflow: hidden;
      font-family: 'Noto Serif Bengali', serif;
      box-sizing: border-box;
      background-color: #fffdf8;
    }

    /* Dedicated Full Background Image Layer */
    .dedicated-bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 0;
    }

    /* Header Section */
    .header-section {
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .shloka {
      font-size: 20px;
      font-weight: 700;
      color: #6b0c11;
      letter-spacing: 2px;
margin-top: 100px;
      margin-bottom: 0px;
    }

    .celebration-badge {
      display: inline-block;
      color: #6b0c11;
      font-size: 16px;
      font-weight: 800;
      background: rgba(255, 243, 243, 0.9);
      border: 1px solid #d4af37;
      padding: 3px 24px;
      border-radius: 15px;
      margin-bottom: 4px;
      box-shadow: 0 1px 4px rgba(107, 12, 17, 0.08);
    }

    .committee-title {
      font-size: 40px;
      font-weight: 900;
      color: #111;
      margin-top: 3px;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .committee-address {
      font-size: 14.5px;
      color: #333;
      font-weight: 600;
      margin-top: -20px;
    }

    .estd-year {
      font-size: 13.5px;
      color: #6b0c11;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: -15px;
    }

    .title-ribbon {
      background: linear-gradient(90deg, transparent, #6b0c11 15%, #6b0c11 85%, transparent);
      color: #fff;
      display: inline-block;
      padding: 5px 55px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: -10px;
      box-shadow: 0 3px 8px rgba(107, 12, 17, 0.2);
    }

    /* Body Section */
    .body-section {
      text-align: center;
      padding: 0 40px;
      position: relative;
      z-index: 3;
    }

    .poetic-quote {
      font-style: italic;
      font-size: 16px;
      color: #6b0c11;
      font-weight: 600;
      margin-bottom: -7px;
    }

    .honoree-card {
      background: transparent;
      padding: 8px 30px;
      display: inline-block;
      min-width: 550px;
      margin-bottom: -12px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.12);
    }

    .honoree-name {
      font-size: 30px;
      font-weight: 900;
      color: #6b0c11;
      margin: 3px 0;
    }

    .main-citation {
      font-size: 18px;
      line-height: 1.8;
      color: #222;
      font-weight: 500;
      text-align: justify;
      text-align-last: center;
    }

    .blessing-text {
      font-size: 16px;
      font-weight: 700;
      color: #8c6b12;
      margin-top: 8px;
    }

    /* Footer Section */
    .footer-section {
      display: flex;
      justify-content: space-between;
      padding: 0 60px 10px 60px;
      position: relative;
      z-index: 3;
    }

    .sign-box {
      text-align: center;
      width: 210px;
    }

    .sign-bar {
      height: 1.8px;
      background: #333;
      margin-bottom: 6px;
    }

    .sign-name {
      font-size: 16px;
      font-weight: 800;
      color: #111;
    }

    .sign-role {
      font-size: 13.5px;
      color: #555;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="control-panel">
    <h2>বাল্ক মানপত্ৰ জেনেৰেটৰ (Bulk Certificate Generator)</h2>
    <p style="color: #555; margin-bottom: 8px; font-size: 14px;">
      Honoree names list (one name per line):
    </p>
    <textarea id="namesInput">
ৰমেশ শৰ্মা
</textarea>
    
    <div class="btn-bar">
      <button class="btn-generate" onclick="generateAll()">১. Generate All Certificates</button>
      <button class="btn-print" onclick="window.print()">২. Print / Save as PDF</button>
    </div>
  </div>

  <!-- Render Container -->
  <div id="certificates-wrapper"></div>

  <script>
    // Automatic fallback to locate your background file
    function tryNextBackground(img) {
      const paths = [
        'background.png',
        'background.jpg',
        'background.jpeg',
        '../background.png',
        '../background.jpg'
      ];
      let step = parseInt(img.getAttribute('data-step') || '0', 10);
      if (step < paths.length) {
        img.setAttribute('data-step', step + 1);
        img.src = paths[step];
      }
    }

    function generateAll() {
      const input = document.getElementById("namesInput").value.trim();
      const names = input.split("\n").map(n => n.trim()).filter(n => n.length > 0);
      const wrapper = document.getElementById("certificates-wrapper");
      
      wrapper.innerHTML = "";

      names.forEach(name => {
        const certHTML = `
          <div class="certificate-sheet">
            <!-- Dedicated Full Background (Carries your custom borders/motifs) -->
            <img src="background.png" 
                 class="dedicated-bg-layer" 
                 data-step="1"
                 onerror="tryNextBackground(this)"
                 alt="Background">

            <!-- Header Section -->
            <div class="header-section">
              <div class="shloka">॥ শ্ৰী শ্ৰী দুৰ্গাদেৱ্যৈ নমঃ ॥</div>
              
              <div><span class="celebration-badge">৬৩ তম বাৰ্ষিক শাৰদীয় দুৰ্গোৎসৱ</span></div>
              <h1 class="committee-title">বামুনগাঁও কেম্প সাৰ্ব্বজনীন দুৰ্গাপূজা সমিতি</h1>
              <p class="committee-address">পুৰাণ বজাৰ, বামুনগাঁও কেম্প, কামৰূপ, অসম</p>
              <p class="estd-year">স্থাপিত : ১৯৬৪ ইং</p>

              <div class="title-ribbon">কৃতজ্ঞতা আৰু প্ৰশংসা মানপত্ৰ</div>
            </div>

            <!-- Body Section -->
            <div class="body-section">
              <div class="poetic-quote">
                "শাৰদীয় শেৱালিৰ সুবাসে আনে দেৱী বন্দনাৰ সুৰ, আপোনাৰ সেৱাই কৰে পূজাক সাফল্যমণ্ডিত..."
              </div>

              <div class="honoree-card">
                <div class="honoree-name">শ্ৰী / শ্ৰীমতী ${name}</div>
              </div>

              <p class="main-citation">
                ১৯৬৪ চনৰ পৰা প্ৰবাহিত আমাৰ ঐতিহ্যমণ্ডিত <b>বামুনগাঁও কেম্প সাৰ্ব্বজনীন দুৰ্গাপূজাখনিৰ</b> গৌৰৱোজ্জ্বল যাত্ৰাত আপোনাৰ নিৰলস কৰ্মনিষ্ঠা, নিস্বাৰ্থ সেৱা আৰু বছৰ বছৰ ধৰি আগবঢ়োৱা অনবদ্য অৱদানক গভীৰ কৃতজ্ঞতাৰে স্বীকাৰ কৰি সমিতিয়ে এই <b>প্ৰশংসা পত্ৰ</b> সাদৰে অৰ্পণ কৰিলে।
              </p>

              <p class="blessing-text">
                জগজ্জননী মা দুৰ্গাৰ কৃপাত আপোনাৰ জীৱন সদায় সুখ, শান্তি, সুস্বাস্থ্য আৰু সমৃদ্ধিৰে উদ্ভাসিত হৈ ৰওক।
              </p>
            </div>

            <!-- Footer Signatures -->
            <div class="footer-section">
              <div class="sign-box">
                <div class="sign-bar"></div>
                <div class="sign-name">সমৰ কুমাৰ ঘোষ</div>
                <div class="sign-role">সভাপতি</div>
              </div>

              <div class="sign-box">
                <div class="sign-bar"></div>
                <div class="sign-name">পংকজ দাস</div>
                <div class="sign-role">সাধাৰণ সম্পাদক</div>
              </div>
            </div>
          </div>
        `;
        wrapper.insertAdjacentHTML('beforeend', certHTML);
      });
    }

    window.onload = generateAll;
  </script>
</body>
</html>
